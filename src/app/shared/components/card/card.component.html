<mat-card (click)="!isLoadingData && openModal()">
  <mat-card-header>
    <mat-card-title matTooltip="{{ cardTitle }}">{{
      cardTitle
    }}</mat-card-title>
    <mat-card-subtitle>{{ cardSubtitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    @if (showAttendance) {
      <mat-progress-bar [value]="cardPercentage"></mat-progress-bar>
      <p>{{ cardPercentage }}%</p>
      @if (attendanceIcon) {
        <mat-icon [fontIcon]="attendanceIcon"></mat-icon>
      }
    }
  </mat-card-content>
  <mat-card-actions>
    <button matButton="tonal">Ver detalles</button>
  </mat-card-actions>
</mat-card>
